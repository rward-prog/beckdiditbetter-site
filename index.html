  <div class="counter">

    <div class="counter-digits" id="total-listened">0 min</div>

  <script>
    // Hit counter via counterapi.dev
    fetch("https://api.counterapi.dev/v1/beckdiditbetter/visits/up")
      .then(r => r.json())
      .then(d => {
        document.getElementById("hit-count").textContent = String(d.count).padStart(6, "0");
      })
      .catch(() => {});

    const STREAM_URL   = "https://stream.beckdiditbetter.com/stream";
    const ICECAST_JSON = "https://stream.beckdiditbetter.com/status-json.xsl";
    const INFO_URL     = "https://info.beckdiditbetter.com/info";

    let audio = new Audio();
    audio.preload = "none";

    const playBtn       = document.getElementById("play-btn");
    const epTitle       = document.getElementById("ep-title");
    const epDate        = document.getElementById("ep-date");
    const npDot         = document.getElementById("np-dot");
    const progressBar   = document.getElementById("progress-bar");
    const elapsedEl     = document.getElementById("elapsed");
    const remainingEl   = document.getElementById("ep-remaining");
    const statusEl      = document.getElementById("status");
    const volSlider     = document.getElementById("volume");
    const totalListenEl = document.getElementById("total-listened");

    let playing = false, pollTimer = null, infoTimer = null, tickTimer = null;
    let currentTitle = null;
    let serverElapsed = 0, serverDuration = 0, serverFetchedAt = null;
    let nextAudio = null, preloading = false, stallTimer = null;
    let totalListenedSecs = parseInt(localStorage.getItem("bdibTotalSecs") || "0", 10);

    audio.volume = parseFloat(volSlider.value);
    updateTotalCounter();
    audio.addEventListener("error", onError);
    audio.addEventListener("waiting", onWaiting);
    audio.addEventListener("playing", onResumed);

    playBtn.addEventListener("click", () => playing ? stop() : start());
    volSlider.addEventListener("input", () => { audio.volume = parseFloat(volSlider.value); });

    function fmtTime(secs) {
      secs = Math.max(0, Math.floor(secs));
      const h = Math.floor(secs / 3600);
      const m = Math.floor((secs % 3600) / 60);
      const s = secs % 60;
      if (h > 0) return `${h}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
      return `${m}:${String(s).padStart(2,"0")}`;
    }

    function fmtRemaining(secs) {
      secs = Math.max(0, Math.floor(secs));
      const totalMins = Math.ceil(secs / 60);
      const h = Math.floor(totalMins / 60);
      const m = totalMins % 60;
      if (h > 0) return `${h}h ${m}m left`;
      return `${m}m left`;
    }

    function updateTotalCounter() {
      const mins = Math.floor(totalListenedSecs / 60);
      if (mins < 60) {
        totalListenEl.textContent = `${mins} min`;
      } else {
        const h = Math.floor(mins / 60);
        const m = mins % 60;
        totalListenEl.textContent = `${h}h ${m}m`;
      }
    }

    function tick() {
      if (!playing) return;

      totalListenedSecs++;
      localStorage.setItem("bdibTotalSecs", totalListenedSecs);
      updateTotalCounter();

      if (!serverFetchedAt || !serverDuration) return;
      const elapsed = serverElapsed + (Date.now() - serverFetchedAt) / 1000;
      const remaining = Math.max(0, serverDuration - elapsed);
      elapsedEl.textContent = fmtTime(elapsed);
      remainingEl.textContent = fmtRemaining(remaining);
      progressBar.style.width = Math.min(100, (elapsed / serverDuration) * 100) + "%";
      maybePreload(remaining);
    }

    // Start a silent second connection ~60s before end so transition is already buffered
    function maybePreload(remaining) {
      if (preloading || !playing || remaining <= 0 || remaining > 60) return;
      preloading = true;
      nextAudio = new Audio();
      nextAudio.volume = 0;
      nextAudio.src = STREAM_URL + "?t=" + Date.now();
      nextAudio.play().catch(() => nextAudio && nextAudio.load());
    }

    function swapToPreloaded() {
      if (!nextAudio) return;
      const vol = audio.volume;
      audio.removeEventListener("error", onError);
      audio.removeEventListener("waiting", onWaiting);
      audio.removeEventListener("playing", onResumed);
      audio.pause();
      audio.src = "";
      audio = nextAudio;
      audio.volume = vol;
      if (audio.paused) audio.play().catch(() => {});
      audio.addEventListener("error", onError);
      audio.addEventListener("waiting", onWaiting);
      audio.addEventListener("playing", onResumed);
      nextAudio = null;
      preloading = false;
    }

    function onError() {
      if (!playing) return;
      setStatus("Stream dropped — reconnecting…", true);
      const vol = audio.volume;
      audio.src = "";
      setTimeout(() => {
        if (!playing) return;
        audio.src = STREAM_URL + "?t=" + Date.now();
        audio.volume = vol;
        audio.play().catch(() => {});
      }, 2000);
    }

    function onWaiting() {
      if (!playing) return;
      clearTimeout(stallTimer);
      stallTimer = setTimeout(() => {
        if (playing && audio.readyState < 3) onError();
      }, 6000);
    }

    function onResumed() {
      clearTimeout(stallTimer);
    }

    function start() {
      audio.src = STREAM_URL + "?t=" + Date.now();
      audio.play()
        .then(() => {
          playing = true;
          playBtn.textContent = "⏸";
          npDot.classList.add("live");
          setStatus("Connected · all episodes shuffled");
          fetchNP();
          fetchInfo();
          pollTimer = setInterval(fetchNP, 9000);
          infoTimer = setInterval(fetchInfo, 5000);
          tickTimer = setInterval(tick, 1000);
        })
        .catch(() => setStatus("Stream not reachable — check back soon.", true));
    }

    function stop() {
      clearTimeout(stallTimer);
      audio.pause(); audio.src = "";
      if (nextAudio) { nextAudio.pause(); nextAudio.src = ""; nextAudio = null; }
      preloading = false;
      playing = false;
      playBtn.textContent = "▶";
      npDot.classList.remove("live");
      clearInterval(pollTimer);
      clearInterval(infoTimer);
      clearInterval(tickTimer);
      epTitle.textContent = "Press play to tune in";
      epDate.textContent = "";
      elapsedEl.textContent = "—";
      remainingEl.textContent = "—";
      progressBar.style.width = "0%";
      currentTitle = null;
      serverElapsed = 0; serverDuration = 0; serverFetchedAt = null;
      setStatus("300+ episodes · random shuffle · 24/7");
    }

    function setStatus(msg, err = false) {
      statusEl.textContent = msg;
      statusEl.className = "status" + (err ? " err" : "");
    }

    fetchNP(); // show current episode on page load

    async function fetchNP() {
      try {
        const d = await fetch(ICECAST_JSON).then(r => r.json());
        const src = d?.icestats?.source;
        if (!src) return;
        const m = Array.isArray(src) ? src.find(s => s.listenurl?.includes("/stream")) : src;
        if (!m?.title) return;

        const raw = m.title;
        const sep = raw.indexOf("  ·  aired ");
        let title, date;
        if (sep !== -1) {
          title = raw.slice(0, sep);
          date = "Aired " + raw.slice(sep + 11);
        } else {
          title = raw;
          date = "";
        }

        if (raw !== currentTitle) {
          currentTitle = raw;
          serverElapsed = 0; serverDuration = 0; serverFetchedAt = null;
          if (playing) {
            swapToPreloaded(); // switch to pre-buffered connection if ready
            fetchInfo();
          }
        }

        epTitle.textContent = title;
        epDate.textContent = date;

        const n = m?.listeners ?? 0;
        if (playing) setStatus(`${n} listener${n !== 1 ? "s" : ""} tuned in`);
      } catch {}
    }

    async function fetchInfo() {
      try {
        const d = await fetch(INFO_URL).then(r => r.json());
        if (d.duration > 0) {
          serverElapsed   = d.elapsed;
          serverDuration  = d.duration;
          serverFetchedAt = Date.now();
        }
      } catch {}
    }
  </script>
