      --navy-dk: #13114a;

      --orange-lt: #ff6a47;
      --white:   #ffffff;

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    .cs-dot {

    /* ── Logo ── */
    .logo img {
      width: min(300px, 80vw);
      height: min(300px, 80vw);

    }

      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 20px;
      padding: 24px 28px;
      width: min(420px, 100%);
    }

    .now-playing {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }
    .np-icon {
      width: 40px;
      height: 40px;
      background: var(--orange);
      border-radius: 10px;
      display: flex;
      align-items: center;

      flex-shrink: 0;
    }
    .np-label { font-size: 10px; font-weight: 700; color: var(--dim); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 3px; }
    .np-title { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 280px; }

    .controls {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 16px;

      width: 52px;
      height: 52px;
      border-radius: 50%;
      border: none;
      background: var(--orange);
      color: white;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform .12s, background .15s;
      flex-shrink: 0;
    }
    .play-btn:hover { background: var(--orange-lt); transform: scale(1.06); }
    .play-btn:active { transform: scale(0.95); }

<body>

  <div class="coming-soon">
    <div class="cs-dot"></div>
    Full site coming soon
  </div>

  <div class="logo">
    <img src="/cover.jpg" alt="Beck Did It Better" />
  </div>

  <div class="player">
    <div class="now-playing">
      <div class="np-icon">🎵</div>
      <div>
        <div class="np-label">Now Playing</div>
        <div class="np-title" id="np-title">Press play to tune in</div>
      </div>
    </div>
    <div class="controls">
      <button class="play-btn" id="play-btn">▶</button>
      <div class="vol-row">
        <span class="vol-icon">🔈</span>
        <input type="range" id="volume" min="0" max="1" step="0.02" value="0.85" />
        <span class="vol-icon">🔊</span>
      </div>
    </div>
    <div class="status" id="status">300+ episodes · random shuffle · 24/7</div>
  </div>

  <div class="links">
    <a href="https://beckdiditbetter.podbean.com" target="_blank" rel="noopener">🎙️ Podbean</a>
    <a href="https://open.spotify.com/show/4sAGj4lhX1ZcLeXWetfFvy" target="_blank" rel="noopener">🎧 Spotify</a>
    <a href="https://podcasts.apple.com/us/podcast/beck-did-it-better/id1527035565" target="_blank" rel="noopener">🍎 Apple Podcasts</a>
  </div>

  <div class="counter">
    <div class="counter-label">visitors</div>
    <div class="counter-digits" id="hit-count">000000</div>
  </div>

  <script>
    // Hit counter via free api.countapi.xyz
    fetch("https://api.countapi.xyz/hit/beckdiditbetter.com/visits")
      .then(r => r.json())
      .then(d => {
        const n = String(d.value).padStart(6, "0");
        document.getElementById("hit-count").textContent = n;
      })
      .catch(() => {});

    const STREAM_URL   = "https://stream.beckdiditbetter.com/stream";
    const ICECAST_JSON = "https://stream.beckdiditbetter.com/status-json.xsl";

    const audio     = new Audio();
    audio.preload   = "none";
    const playBtn   = document.getElementById("play-btn");
    const npTitle   = document.getElementById("np-title");
    const statusEl  = document.getElementById("status");
    const volSlider = document.getElementById("volume");

    let playing = false, pollTimer = null;
    audio.volume = parseFloat(volSlider.value);

    playBtn.addEventListener("click", () => playing ? stop() : start());
    volSlider.addEventListener("input", () => { audio.volume = parseFloat(volSlider.value); });

    function start() {
      audio.src = STREAM_URL + "?t=" + Date.now();
      audio.play()
        .then(() => {
          playing = true;
          playBtn.textContent = "⏸";
          setStatus("Connected · all episodes shuffled");
          fetchNP();
          pollTimer = setInterval(fetchNP, 9000);
        })
        .catch(() => setStatus("Stream not reachable — check back soon.", true));
    }

    function stop() {
      audio.pause(); audio.src = "";
      playing = false;
      playBtn.textContent = "▶";
      clearInterval(pollTimer);
      npTitle.textContent = "Press play to tune in";
      setStatus("300+ episodes · random shuffle · 24/7");
    }

    audio.addEventListener("error", () => {
      if (!playing) return;
      setStatus("Stream dropped — reconnecting in 5s…", true);
      stop(); setTimeout(start, 5000);
    });

    function setStatus(msg, err = false) {
      statusEl.textContent = msg;
      statusEl.className = "status" + (err ? " err" : "");
    }

    async function fetchNP() {
      try {
        const d = await fetch(ICECAST_JSON).then(r => r.json());
        const src = d?.icestats?.source;
        if (!src) return;
        const m = Array.isArray(src) ? src.find(s => s.listenurl?.includes("/stream")) : src;
        if (m?.title) npTitle.textContent = m.title;
        const n = m?.listeners ?? 0;
        setStatus(`${n} listener${n !== 1 ? "s" : ""} tuned in`);
      } catch {}
    }
  </script>
